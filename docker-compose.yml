name: teams-gateway

# 本機：docker compose up -d --build
# Swarm：先 build + push image，再 docker stack deploy -c docker-compose.yml teams
#   （stack deploy 會忽略 build:，要用已 push 的 image；secret 用 shell env 代入）

services:
  gateway:
    build:
      context: .
      dockerfile: services/TeamsGateway.Gateway/Dockerfile
    image: ${REGISTRY:-local}/teams-gateway:${TAG:-latest}
    environment:
      Gateway__AdminToken: ${GATEWAY_ADMIN_TOKEN:?set GATEWAY_ADMIN_TOKEN}
    volumes:
      - gateway-data:/data          # cookie + DataProtection key + SQLite，跨重啟
    ports:
      - "5199:8080"                 # bootstrap / admin / 給同網段的訂閱者；內網才開
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]   # 含 DB 檢查
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 1                    # 單一 Trouter 連線 / 單一 SQLite writer，不可多副本
      restart_policy:
        condition: any
      # Swarm：gateway-data 是 node 本機 volume，換 node 就是空的（要重新 bootstrap）。正式上把它釘在固定 node：
      # placement:
      #   constraints: [node.labels.teams-gateway == true]

  relay:
    build:
      context: .
      dockerfile: services/TeamsGateway.SlackRelay/Dockerfile
    image: ${REGISTRY:-local}/teams-slack-relay:${TAG:-latest}
    depends_on:
      - gateway
    environment:
      Relay__Gateway__BaseUrl: http://gateway:8080
      Relay__Gateway__ApiKey: ${RELAY_GATEWAY_APIKEY:?set RELAY_GATEWAY_APIKEY}
      Relay__Slack__BotToken: ${RELAY_SLACK_BOTTOKEN:?set RELAY_SLACK_BOTTOKEN}
    volumes:
      # Routes（Teams 對話→Slack 頻道）：含冒號 key 不能用 env，掛檔進來
      - ./services/TeamsGateway.SlackRelay/appsettings.Local.json:/app/appsettings.Local.json:ro
    restart: unless-stopped
    deploy:
      replicas: 1                    # 單一 SSE consumer，多副本會重複貼 Slack
      restart_policy:
        condition: any

volumes:
  gateway-data:
