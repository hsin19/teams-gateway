version: 2
updates:
  # 版本集中在 Directory.Packages.props；dotnet-ef 在 dotnet-tools.json。
  - package-ecosystem: 'nuget'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # repo 的目標是 .NET 11（global.json、Directory.Build.props）。跟著 .NET 大版本出的套件會升到 12.x、
      # 要 net12.0，這種 PR 只會一直紅、每週重開。TFM 換到 net12.0 時再拿掉。
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.EntityFrameworkCore*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Npgsql.EntityFrameworkCore.PostgreSQL'
        update-types: ['version-update:semver-major']
      - dependency-name: 'dotnet-ef'
        update-types: ['version-update:semver-major']
    groups:
      # Aspire.AppHost.Sdk（global.json）跟 Aspire.Hosting.* 要停在同一個版本。
      aspire:
        patterns:
          - 'Aspire.*'
      # EF Core、它的 design-time 套件、dotnet-ef 跟 Npgsql provider 一起升。
      efcore:
        patterns:
          - 'Microsoft.EntityFrameworkCore*'
          - 'Npgsql.EntityFrameworkCore.PostgreSQL'
          - 'dotnet-ef'
      opentelemetry:
        patterns:
          - 'OpenTelemetry*'
      xunit:
        patterns:
          - 'xunit*'
      non-major:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      actions:
        patterns:
          - '*'
