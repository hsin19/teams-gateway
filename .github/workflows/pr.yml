name: Pull Request

# PR 要跑的全部：共用的 check.yml，加上只對 PR 有意義的規則——dependency review 與 Dependabot 自動 merge。
# 用觸發它的事件命名、不叫 `ci.yml`：release.yml 也呼叫同一套檢查，CI 不是分辨它們的地方。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # 要先開 Dependency graph（見 README.md），沒開之前每個 PR 都會在這裡失敗。
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # 經 hsin19/actions 的共用 workflow merge 綠燈的 Dependabot PR；這裡的「綠燈」就是 `needs` 列的那些。
  # AUTOMERGE_TOKEN 是 Dependabot secret、不是 GITHUB_TOKEN，merge 後 push 到 main 才會照樣跑 check.yml。
  # token 怎麼設見 README.md。
  auto-merge:
    needs: [check, dependency-review]
    uses: hsin19/actions/.github/workflows/dependabot-automerge.yml@v1
    secrets:
      token: ${{ secrets.AUTOMERGE_TOKEN }}
