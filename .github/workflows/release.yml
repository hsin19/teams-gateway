name: Release

# On a v* tag: once check.yml passes, build the gateway and relay images with the .NET SDK
# (`dotnet publish -t:PublishContainer`, no Dockerfile; see ADR 0010), smoke-check them, and push
# them to GHCR as linux/amd64 + linux/arm64 under one tag. The SDK assembles both architectures on
# this x64 runner without emulation: the app is IL, and only NuGet's native libraries differ.
# Image tags: v1.2.3 -> 1.2.3, 1.2, sha-<short sha>. Deployments pin one of them (see the README's
# deployment section).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release per tag at a time, and never cancel one in flight: a half-pushed set of tags is
# worse than a slightly late one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  image:
    name: Image (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: teams-gateway
            project: services/TeamsGateway.Gateway
          - image: teams-slack-relay
            project: services/TeamsGateway.SlackRelay

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A pre-release (v1.2.3-rc.1) gets no major.minor tag, so 1.2 keeps pointing at a release.
      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          tags="$version"
          if [[ "$version" != *-* ]]; then
            tags="$tags;${version%.*}"
          fi
          tags="$tags;sha-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Only the runner's own architecture goes into the local engine to be run: the arm64 half
      # differs from it only in NuGet's native libraries, and running it here would need QEMU.
      - name: Build for the smoke check
        run: >
          dotnet publish ${{ matrix.project }} -t:PublishContainer
          -p:ContainerRuntimeIdentifier=linux-x64
          -p:ContainerImageTag=smoke
          -p:Version=${{ steps.tags.outputs.version }}

      # No secrets and no Teams login: the gateway still migrates its SQLite DB and answers /health,
      # which catches a broken image (missing runtime files, a crash on startup). Its /data is a host
      # directory owned by the image's non-root user (uid 1654), as a deployment must provide. The
      # relay has no HTTP endpoint, so for it "still running after a few seconds" is the bar.
      - name: Smoke check
        run: |
          image="${{ matrix.image }}:smoke"
          if [ "${{ matrix.image }}" = teams-gateway ]; then
            data="$RUNNER_TEMP/data"
            mkdir "$data"
            sudo chown 1654:1654 "$data"
            docker run -d --name smoke -p 8080:8080 -v "$data:/data" "$image"
            for _ in $(seq 1 30); do
              if curl -fsS http://localhost:8080/health | grep -q Healthy; then
                echo "gateway is healthy"
                exit 0
              fi
              sleep 2
            done
            docker logs smoke
            exit 1
          fi
          docker run -d --name smoke "$image"
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then
            docker logs smoke
            exit 1
          fi
          echo "relay is still running"

      # The SDK reads the credentials docker login stores, per registry. Its DOTNET_CONTAINER_REGISTRY_*
      # variables would instead also be sent to the base image's registry (MCR).
      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}

      # Both architectures, merged into one image index under every tag and pushed straight to the
      # registry. Same inputs as the smoke build, so the x64 half is an incremental rebuild.
      - name: Push
        run: >
          dotnet publish ${{ matrix.project }} -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository="${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          -p:ContainerImageTags="\"$TAGS\""
          -p:Version=${{ steps.tags.outputs.version }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
