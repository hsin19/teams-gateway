name: Check

# 「這棵樹過了沒」的唯一定義：build、unit test、SQLite 與 Postgres 兩套 functional test、repo 腳本的 shellcheck。
# pr.yml 和 release.yml 都呼叫它，PR 和 release 用同一套標準，清單不會兩邊各長各的。
# main 沒有自己的部署 workflow，所以 push 觸發放在這裡；workflow_dispatch 可以對任何 ref 跑全部檢查。
# E2E 會真的在 Teams 發訊息，不在這裡跑，改由 canary.yml 排程。
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        id: build
        run: dotnet build

      # 每組測試各一個 step，不串成一條指令：紅的那個 step 就說明了是哪組壞掉。
      # `!cancelled()` 讓一次跑完就看得到所有失敗，不會停在第一個；
      # 也要 build 成功才跑，不然編譯錯誤會讓下面整排 step 一起紅、把真正的原因埋掉。
      - name: Unit tests (gateway)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/TeamsGateway.Gateway.UnitTests --no-build

      - name: Unit tests (relay)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/TeamsGateway.SlackRelay.UnitTests --no-build

      - name: Functional tests (SQLite)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/TeamsGateway.Gateway.FunctionalTests --no-build

      # runner 有 Docker；DCP 從 NuGet 來，所以不用裝 Aspire CLI（見測試專案的 csproj）。
      - name: Functional tests (Postgres)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/TeamsGateway.Gateway.FunctionalTests --no-build
        env:
          GATEWAY_TEST_DB: postgres

      # ubuntu runner 的 image 內建 shellcheck。
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: shellcheck tools/*.sh
