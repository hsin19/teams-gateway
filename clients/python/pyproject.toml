[project]
name = "teams-gateway-client"
version = "0.1.0"
description = "個人版 Teams gateway 的 Python client（REST + SSE）"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_gateway"]
