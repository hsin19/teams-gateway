[project]
name = "teams-gateway-client"
version = "0.1.0"
description = "Python client for the personal Teams gateway (REST + SSE)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_gateway"]
